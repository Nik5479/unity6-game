name: Build Android APK

on:
  push:
    branches: [main]
    # Docs-only and emulator-test-only pushes don't need a 30-min Unity build.
    paths-ignore:
      - '**.md'
      - '.github/workflows/emulator-test.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      development:
        description: 'Development build (extra logging in logcat)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: write   # test results check ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # 1) Disk khali karo (sabse pehle)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: true

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Tests
        uses: game-ci/unity-test-runner@v4
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.28f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # 2) Test image hatao, warna builder ke liye disk full
      - name: Docker prune
        run: |
          docker system prune -af || true
          df -h /

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.3.28f1
          allowDirtyBuild: true
          # Our own build method: signs with the stable keystore when it exists
          # (local machine), otherwise with Unity's auto debug key (CI).
          # Without this the default GameCI builder used
          # androidUseCustomKeystore: 1 from ProjectSettings with no keystore
          # file / passwords -> "Can not sign the application".
          buildMethod: BuildScript.BuildAndroid
          customParameters: ${{ inputs.development && '-devBuild' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 2

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: TestScreenshots/**
          if-no-files-found: warn
          retention-days: 2
